<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.65" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Subtle ambient glow behind the break point -->
  <rect width="1024" height="1024" rx="220" fill="url(#glow)"/>

  <!-- The mark: a "U" whose right arm breaks free upward -->
  <path d="M 370 340
           L 370 600
           Q 370 720 512 720
           Q 654 720 654 600
           L 654 440
           L 694 316"
        fill="none"
        stroke="url(#mark)"
        stroke-width="52"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Spark at the tip of the break -->
  <circle cx="706" cy="284" r="14" fill="#c4b5fd" opacity="0.8"/>
</svg>
